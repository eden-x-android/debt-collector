# File mẫu GitHub Action. Để kích hoạt: copy file này thành
# `.github/workflows/deploy.yml` (qua GitHub web UI, hoặc git với OAuth scope
# `workflow`), rồi thêm 3 secrets nêu bên dưới.

name: Deploy to Vercel (Production)

# LƯU Ý: Nếu đã bật Vercel Git Integration (import repo trên dashboard),
# Vercel đã tự deploy mỗi lần push — KHÔNG cần workflow này (dùng cả hai sẽ
# deploy 2 lần). Workflow này dành cho trường hợp muốn CI tự chủ việc deploy:
# hãy tắt Auto-deploy của Vercel cho repo, rồi thêm 3 secrets bên dưới.
#
# Secrets cần thêm ở GitHub → Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN        (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID       (lấy từ .vercel/project.json sau khi chạy `vercel link`,
#   VERCEL_PROJECT_ID    hoặc trong Vercel → Project → Settings)
#
# Biến môi trường app (DATABASE_URL, SESSION_SECRET, RESEND_API_KEY...) KHÔNG
# đặt ở đây — chúng được `vercel pull` kéo từ Environment Variables của project.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
